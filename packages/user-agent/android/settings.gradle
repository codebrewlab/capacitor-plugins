// npm workspace 는 @capacitor/android 를 레포 루트로 hoist 하기도 하고
// 패키지 하위에 nested 로 두기도 한다 (Capacitor 8 부터 nested 로 떨어진다).
// 두 배치 모두에서 검증 빌드가 돌게 실제 존재하는 경로를 찾아 쓴다.
def capacitorAndroidDir = [
    '../node_modules/@capacitor/android/capacitor',
    '../../../node_modules/@capacitor/android/capacitor',
].collect { new File(settingsDir, it) }.find { it.exists() }

if (capacitorAndroidDir == null) {
    throw new GradleException('@capacitor/android 를 찾을 수 없습니다. npm install 을 먼저 실행하세요.')
}

include ':capacitor-android'
project(':capacitor-android').projectDir = capacitorAndroidDir
